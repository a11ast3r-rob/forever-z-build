name: Deploy Forever Z to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' . _site/
          python - <<'PY'
          from pathlib import Path

          def rewrite(path, replacements):
              page = Path(path)
              if not page.exists():
                  return
              text = page.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new, 1)
              page.write_text(text, encoding='utf-8')

          # Put the two real secondary pages where they are immediately visible,
          # including on the narrow horizontally-scrolling mobile nav.
          rewrite('_site/index.html', [
              (
                  '<a href="#arrival">Arrival</a><a href="#mechanical">Mechanical</a>',
                  '<a href="#arrival">Arrival</a><a href="baseline.html">Baseline</a><a href="tools.html">Tools</a><a href="#mechanical">Mechanical</a>'
              ),
              (
                  '<div class="tracker-tools"><button class="btn" id="copySnapshot">Copy snapshot</button><button class="btn" id="exportState">Export tracker JSON</button></div>',
                  '<div class="tracker-tools"><a class="btn link" href="baseline.html">144k Baseline</a><a class="btn link" href="tools.html">Tool Roadmap</a><button class="btn" id="copySnapshot">Copy snapshot</button><button class="btn" id="exportState">Export tracker JSON</button></div>'
              )
          ])

          # Keep the secondary pages fully visual. Raw Markdown remains source/docs,
          # but it is no longer presented as a primary page-navigation destination.
          rewrite('_site/tools.html', [
              (
                  '<div class="topbar"><a class="btn" href="./">← Back to Mission Control</a><a class="btn" href="TOOLS.md">Source notes</a></div>',
                  '<div class="topbar"><a class="btn" href="./">← Mission Control</a><a class="btn" href="baseline.html">144k Baseline</a></div>'
              )
          ])
          rewrite('_site/baseline.html', [
              (
                  '<div class="toplinks"><a class="btn" href="./">← Mission Control</a><a class="btn" href="tools.html">Tools</a><a class="btn" href="MECHANICAL_BASELINE.md">Mechanical plan</a></div>',
                  '<div class="toplinks"><a class="btn" href="./">← Mission Control</a><a class="btn" href="tools.html">Tools</a><a class="btn" href="./#mechanical">Mechanical overview</a></div>'
              )
          ])

          # Shared browser-local backup/restore + cross-page tool-state sync.
          marker = '<script src="./site-extra.js?v=20260911-4"></script>\n<script src="./parts-shelf.js?v=20260911-1"></script>'
          for page in Path('_site').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'site-extra.js' not in text and '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>')
                  page.write_text(text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
