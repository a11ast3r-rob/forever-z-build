name: Deploy Forever Z to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '_site' . _site/
          python - <<'PY'
          from pathlib import Path
          marker = '<script src="./site-extra.js"></script>'
          for page in Path('_site').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if marker not in text and '</body>' in text:
                  text = text.replace('</body>', marker + '\n</body>')
                  page.write_text(text, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
